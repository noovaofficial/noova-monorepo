# Почта доменов + веб-почта + лендинг будущего продукта. Одна машина:
# корень MAIL_DOMAIN отдаёт лендинг, mail.<домен> — почтовый сервер,
# webmail.<домен> — веб-почта.
#
# Зачем отдельная машина: провайдер основного сервера держит исходящий 25-й
# порт закрытым и открывать отказался («closed in order to prevent spam»), а
# без него письма не уходят никуда. Внешний ESP не подошёл — SendPulse,
# Postmark, Resend, Brevo и прочие запрещают тематику каталога в AUP, и
# блокировка аккаунта остановила бы регистрацию и сброс пароля. Решение N-15
# в силе. Лендинг подселили сюда же, а не завели третью машину — площадке не
# нужны ни база, ни API.
#
# Почтовый сервер — Stalwart: отправляет письма сайта (Postfix на Prod сдаёт
# их сюда по 587-му), принимает почту на noova.fyi и noova.cc и даёт
# веб-интерфейс для ящиков. Настроек в этом файле почти нет: Stalwart хранит
# их в своей базе, а то, от чего зависит отправка писем сайта, описано в
# stalwart/plan.ndjson и накатывается по documentation/deploy/smtp.md.
#
# Веб-почта — Roundcube: читать и отправлять письма из браузера. Своего
# хранилища писем у неё нет, она ходит в Stalwart по IMAP и SMTP.
#
# Перед первым запуском:
#   1) PTR на этот IP → mail.<домен>, иначе письма отклоняют на входе;
#   2) A <домен>, A mail.<домен>, A webmail.<домен> → этот IP, ip4 в SPF на него;
#   3) `docker compose up -d caddy`, ПОТОМ `certs.sh mail.<домен>` — Caddy
#      должен уже отвечать на 80-м, иначе certbot'у некуда положить
#      челлендж (см. certs.sh и Caddyfile);
#   4) ключи DKIM лежат в ./dkim, план накатан — smtp.md. Голый
#      `docker compose up -d stalwart` на пустой базе поднимает встроенный
#      набор портов (в том числе 8080 без TLS) и ни одного домена.
#
# Разворачивается вручную, `make deploy` сюда не ходит.

# Адреса Caddy и Stalwart фиксированные, потому что на них завязаны
# настройки: Roundcube верит X-Forwarded-For только от адреса Caddy
# (roundcube/config.inc.php), а имя mail.<домен> внутри контейнера Roundcube
# указывает на адрес Stalwart (extra_hosts).
networks:
  mail:
    ipam:
      config:
        - subnet: 10.77.0.0/24

services:
  # Лендинг — статика на корневом домене, веб-почта через reverse_proxy, и
  # ACME-челлендж для сертификата почты (mail.<домен>): сам Caddy TLS для
  # mail.<домен> не выпускает, только отдаёт файл челленджа из общего с
  # certbot вебрута — см. Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - ./acme-webroot:/srv/acme-webroot:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      mail:
        ipv4_address: 10.77.0.10

  # Версия закреплена точно: обновление почтового сервера — отдельное решение
  # с чтением UPGRADING, а не побочный эффект `docker compose pull`.
  stalwart:
    image: stalwartlabs/stalwart:v0.16.21
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    ports:
      # Приём почты на домены. Открыт всем: MX указывает сюда. Чужой релей
      # Stalwart не пропускает, вход по паролю на 25-м не предлагает.
      - '25:25'
      # Submission для Postfix на Prod. ufw пускает только его IP, а пароль
      # noreply в самом Stalwart привязан к тому же адресу (plan.ndjson).
      - '587:587'
      # Почтовые клиенты: отправка и чтение, только TLS.
      - '465:465'
      - '993:993'
      # Веб-интерфейс. 443-й занят Caddy под лендинг.
      - '8443:8443'
    environment:
      # Адрес, который интерфейс отдаёт браузеру для входа. Без него туда
      # подставляется имя контейнера, и после ввода пароля браузер уходит на
      # несуществующий адрес.
      STALWART_PUBLIC_URL: https://mail.${MAIL_DOMAIN}:8443
      # Healthcheck образа стучится на 443 и 8080, а у нас ни того, ни другого:
      # без этой строки контейнер навсегда «unhealthy» при работающей почте.
      STALWART_HEALTHCHECK_URL: https://127.0.0.1:8443/healthz/live
    volumes:
      # Только адрес базы. Остальные настройки Stalwart хранит в ней самой.
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - ./certs:/etc/stalwart/certs:ro
      - ./dkim:/etc/stalwart/dkim:ro
      # Ящики, очередь, учётки, настройки. Том, а не каталог: Stalwart пишет
      # под uid 2000, и владельца тома Docker выставляет из образа сам.
      - stalwart_data:/var/lib/stalwart
    networks:
      mail:
        ipv4_address: 10.77.0.20

  # Веб-почта. nonroot: процессы не под root, и взлом веб-приложения, которое
  # разбирает чужой HTML, не даёт root в контейнере.
  roundcube:
    image: roundcube/roundcubemail:1.7.4-apache-nonroot
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    environment:
      # Имя, а не адрес контейнера: сертификат Stalwart выписан на
      # mail.<домен>, и Roundcube его проверяет. Внутри контейнера это имя
      # указывает прямо на Stalwart (extra_hosts), трафик не выходит наружу.
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_SMTP_PORT: 465
      # Ключ шифрования сессий. Без него образ генерирует новый при каждом
      # пересоздании контейнера, и всех выкидывает из веб-почты.
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:-}
    extra_hosts:
      - mail.${MAIL_DOMAIN}:10.77.0.20
    volumes:
      # Весь /var/roundcube, а не только db: каталога db в образе нет, и том,
      # смонтированный туда, достался бы root — Roundcube под www-data не смог
      # бы создать базу. Здесь лежат только настройки пользователей, контакты
      # и сессии; сами письма — в Stalwart.
      - roundcube_data:/var/roundcube
      - ./roundcube/config.inc.php:/var/roundcube/config/noova.inc.php:ro
    networks:
      - mail

volumes:
  stalwart_data:
  roundcube_data:
  caddy_data:
  caddy_config:
