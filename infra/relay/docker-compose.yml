# Почтовый релей. Отдельная машина, только отправка писем.
#
# Зачем отдельная: провайдер основного сервера держит исходящий 25-й порт
# закрытым и открывать отказался («closed in order to prevent spam»), а без
# него письма не уходят никуда. Внешний ESP не подошёл — SendPulse, Postmark,
# Resend, Brevo и прочие запрещают тематику каталога в AUP, и блокировка
# аккаунта остановила бы регистрацию и сброс пароля. Решение N-15 в силе,
# просто Postfix переехал на вторую машину.
#
# Здесь тот же образ, что раньше стоял рядом с api. Разница в трёх вещах:
# порт 587 смотрит наружу, вход по паролю обязателен, TLS обязателен.
#
# Перед первым запуском:
#   1) PTR на этот IP → mail.<домен>, иначе письма отклоняют на входе;
#   2) A mail.<домен> → этот IP, и ip4 в SPF на него же;
#   3) сертификат для mail.<домен> в ./certs (см. server.md §4);
#   4) том dkim_keys перенесён со старой машины — тогда запись
#      mail._domainkey в DNS менять не придётся.
#
# Разворачивается вручную, `make deploy` сюда не ходит: машина живёт своей
# жизнью и обновляется раз в никогда.

services:
  smtp:
    image: boky/postfix:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    ports:
      # Только submission. Порт 25 наружу не публикуется: он нужен исходящим,
      # а входящую почту мы не принимаем вовсе — MX на домене нет.
      #
      # ufw обязан ограничить источник адресом основного сервера:
      #   ufw allow from <IP основного сервера> to any port 587 proto tcp
      # Пароль и SASL — вторая линия, а не первая.
      - '587:587'
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN}
      # Должно совпадать с PTR, иначе принимающие серверы считают отправителя
      # представившимся чужим именем.
      HOSTNAME: mail.${MAIL_DOMAIN}
      DKIM_AUTOGENERATE: 'true'

      # Без этого получился бы открытый релей: 587-й торчит наружу, и чужие
      # рассылки поедут от вашего домена в тот же день, а следом домен уедет
      # в чёрные списки.
      SMTPD_SASL_USERS: ${RELAY_USER}:${RELAY_PASSWORD}

      # Пароль уходит по открытой сети между двумя датацентрами, поэтому
      # шифрование не «по возможности», а обязательно. Самоподписанный
      # сертификат тут не годится: клиент не сможет отличить релей от того,
      # кто встал на пути, а в теле письма — одноразовая ссылка.
      POSTFIX_smtpd_tls_security_level: encrypt
      POSTFIX_smtpd_tls_cert_file: /etc/ssl/relay/fullchain.pem
      POSTFIX_smtpd_tls_key_file: /etc/ssl/relay/privkey.pem
      # Наружу, к чужим серверам, — как получится: половина интернета всё ещё
      # без TLS, и требовать его значит не доставить письмо вовсе.
      POSTFIX_smtp_tls_security_level: may
    volumes:
      - ./certs:/etc/ssl/relay:ro
      - dkim_keys:/etc/opendkim/keys

volumes:
  dkim_keys:
