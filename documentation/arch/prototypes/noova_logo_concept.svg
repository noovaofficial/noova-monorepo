<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" font-family="Futura, 'Century Gothic', 'Helvetica Neue', Arial, sans-serif">
  <!-- background -->
  <rect width="1200" height="860" fill="#1E1320"/>

  <!-- header -->
  <text x="80" y="78" fill="#FBF4F0" font-size="30" font-weight="600" letter-spacing="8">NOOVA</text>
  <text x="80" y="106" fill="#E0457B" font-size="17" letter-spacing="2">концепт знака · сердце-пламя</text>
  <line x1="80" y1="124" x2="1120" y2="124" stroke="#3A2A3D" stroke-width="1"/>

  <!-- CARD 1: white mark on rose -->
  <rect x="80" y="160" width="300" height="300" rx="28" fill="#E0457B"/>
  <g transform="translate(160,205) scale(1.4)" stroke="#FBF4F0" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50,82 C30,64 12,52 12,34 C12,20 24,12 36,16 C44,18 48,24 50,30 C52,24 56,18 64,16 C76,12 88,20 88,34 C88,52 70,64 50,82 Z"/>
    <path d="M50,68 C42,60 42,52 50,42 C58,52 58,60 50,68 Z"/>
  </g>
  <text x="230" y="498" fill="#9C8AA0" font-size="16" text-anchor="middle" letter-spacing="1">на розовом</text>

  <!-- CARD 2: rose mark on off-white -->
  <rect x="450" y="160" width="300" height="300" rx="28" fill="#FBF4F0"/>
  <g transform="translate(530,205) scale(1.4)" stroke="#E0457B" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50,82 C30,64 12,52 12,34 C12,20 24,12 36,16 C44,18 48,24 50,30 C52,24 56,18 64,16 C76,12 88,20 88,34 C88,52 70,64 50,82 Z"/>
    <path d="M50,68 C42,60 42,52 50,42 C58,52 58,60 50,68 Z"/>
  </g>
  <text x="600" y="498" fill="#9C8AA0" font-size="16" text-anchor="middle" letter-spacing="1">на светлом</text>

  <!-- CARD 3: white heart + coral flame on plum (dark theme) -->
  <rect x="820" y="160" width="300" height="300" rx="28" fill="#241827" stroke="#3A2A3D" stroke-width="1"/>
  <g transform="translate(900,205) scale(1.4)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50,82 C30,64 12,52 12,34 C12,20 24,12 36,16 C44,18 48,24 50,30 C52,24 56,18 64,16 C76,12 88,20 88,34 C88,52 70,64 50,82 Z" stroke="#FBF4F0" stroke-width="5"/>
    <path d="M50,68 C42,60 42,52 50,42 C58,52 58,60 50,68 Z" stroke="#FF8A5C" stroke-width="5"/>
  </g>
  <text x="970" y="498" fill="#9C8AA0" font-size="16" text-anchor="middle" letter-spacing="1">тёмная тема · искра-акцент</text>

  <!-- WORDMARK LOCKUP -->
  <g transform="translate(440,540) scale(0.85)" stroke="#FBF4F0" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50,82 C30,64 12,52 12,34 C12,20 24,12 36,16 C44,18 48,24 50,30 C52,24 56,18 64,16 C76,12 88,20 88,34 C88,52 70,64 50,82 Z"/>
    <path d="M50,68 C42,60 42,52 50,42 C58,52 58,60 50,68 Z" stroke="#FF8A5C"/>
  </g>
  <text x="540" y="620" fill="#FBF4F0" font-size="92" font-weight="600" letter-spacing="4">noova</text>

  <!-- PALETTE -->
  <text x="80" y="700" fill="#FBF4F0" font-size="20" font-weight="600" letter-spacing="2">ПАЛИТРА</text>

  <g>
    <rect x="80" y="724" width="240" height="64" rx="10" fill="#E0457B"/>
    <text x="80" y="816" fill="#FBF4F0" font-size="18" font-weight="600">#E0457B</text>
    <text x="80" y="838" fill="#9C8AA0" font-size="14">Rose · основной</text>
  </g>
  <g>
    <rect x="340" y="724" width="240" height="64" rx="10" fill="#FF8A5C"/>
    <text x="340" y="816" fill="#FBF4F0" font-size="18" font-weight="600">#FF8A5C</text>
    <text x="340" y="838" fill="#9C8AA0" font-size="14">Coral · искра</text>
  </g>
  <g>
    <rect x="600" y="724" width="240" height="64" rx="10" fill="#1E1320" stroke="#3A2A3D" stroke-width="1"/>
    <text x="600" y="816" fill="#FBF4F0" font-size="18" font-weight="600">#1E1320</text>
    <text x="600" y="838" fill="#9C8AA0" font-size="14">Plum · база/текст</text>
  </g>
  <g>
    <rect x="860" y="724" width="240" height="64" rx="10" fill="#FBF4F0"/>
    <text x="860" y="816" fill="#FBF4F0" font-size="18" font-weight="600">#FBF4F0</text>
    <text x="860" y="838" fill="#9C8AA0" font-size="14">Off-white · поверхности</text>
  </g>
</svg>
